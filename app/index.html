<body>
<header id="topbar">
  <div class="brand">
    <span class="logo" style="background:transparent;padding:0;overflow:visible">
      <img src="mascot.jpeg" alt="Soleo" style="width:44px;height:44px;border-radius:50%;object-fit:cover;display:block">
    </span>
    <div>
      <h1 style="display:inline-flex;align-items:center;gap:4px;font-family:'Varela Round','Rubik','Heebo',sans-serif;font-weight:400;font-size:24px;letter-spacing:.01em">soleo<span style="width:8px;height:8px;border-radius:50%;background:#FFD600;display:inline-block;margin-top:10px"></span></h1>
      <div class="sub"><span style="font-weight:700;color:#1C1C1C">Finance made</span> <span style="font-weight:800;color:#F0B400">simple.</span> · <span id="profileLabel"></span></div>
    </div>
  </div>
  <div class="topActions">
    <select id="profileSelect" title="תיק"></select>
    <button id="btnNewProfile" class="ghost" title="תיק חדש">+ תיק</button>
    <button id="btnExport" class="ghost">גיבוי ⬇</button>
    <button id="btnImport" class="ghost">שחזור ⬆</button>
    <input type="file" id="importFile" accept=".json" hidden>
    <button id="btnDemo" class="ghost">טען דוגמה</button>
  </div>
</header>
